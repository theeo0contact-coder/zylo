<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zylo Minecraft Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>⛏ Zylo Hub</h1>
  <p>Minecraft beställningar & reviews</p>
</header>

<!-- INVENTORY MENU -->
<div class="inventory">
  <div class="slot" onclick="openSection('raketer')">🎆 Raketer</div>
  <div class="slot" onclick="openSection('order')">📦 Beställning</div>
  <div class="slot" onclick="openSection('reviews')">💬 Reviews</div>
</div>

<!-- XP BAR -->
<div class="xp-wrap">
  <div id="xpbar" class="xp-bar">Level 0</div>
</div>

<!-- RAKETER -->
<section id="raketer" class="card hidden">
  <h2>Zylos Raketer</h2>
  <p>Coords: -146 68 63</p>
  <p>"Stället du köper dina raketer!"</p>
</section>

<!-- ORDER -->
<section id="order" class="card hidden">
  <h2>Beställning</h2>

  <input id="item" placeholder="Vad vill du beställa?">
  <input id="amount" placeholder="Antal">
  <input id="discord" placeholder="Discord namn">
  <input id="mc" placeholder="Minecraft namn">
  <input id="deadline" placeholder="Deadline">

  <button onclick="sendOrder()">Skicka</button>

  <p id="orderStatus"></p>
</section>

<!-- REVIEWS -->
<section id="reviews" class="card hidden">
  <h2>Reviews - Zylo Raketer beställningssystem</h2>

  <div class="review-box">
    <select id="stars">
      <option value="5">★★★★★</option>
      <option value="4">★★★★☆</option>
      <option value="3">★★★☆☆</option>
      <option value="2">★★☆☆☆</option>
      <option value="1">★☆☆☆☆</option>
    </select>

    <input id="reviewText" placeholder="Skriv review...">
    <button onclick="addReview()">Skicka</button>
  </div>

  <div id="reviewList"></div>
</section>

<script src="script.js"></script>
</body>
</html>
