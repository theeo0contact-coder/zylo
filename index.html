<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Zylo | Moobster SMP</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
<h1>🚀 Zylo</h1>
<p>Zylos Raketer • Minecraft Shop</p>
</header>

<!-- TAB NAV -->
<div class="tabs">

<button onclick="openTab('product')">💥 Zylos Raketer</button>
<button onclick="openTab('order')">🛒 Beställning</button>

</div>

<main>

<!-- PRODUCT TAB -->
<section id="product" class="tab active">

<h2>💥 Zylos Raketer</h2>

<p>Elytra-raketer för snabb flygning</p>

<div class="coords">
📍 Cords: -146 68 63
</div>

<div class="reviewBox">

<h3>⭐ Reviews</h3>

<div id="stars">
<span onclick="rate(1)">⭐</span>
<span onclick="rate(2)">⭐</span>
<span onclick="rate(3)">⭐</span>
<span onclick="rate(4)">⭐</span>
<span onclick="rate(5)">⭐</span>
</div>

<textarea id="reviewText" placeholder="Skriv review"></textarea>

<button onclick="leaveReview()">Lämna review</button>

<p id="reviewStats"></p>

<div id="reviewList"></div>

</div>

</section>

<!-- ORDER TAB (PINNED / FAST) -->
<section id="order" class="tab">

<h2>🛒 Beställning (Zylo Shop)</h2>

<p>Beställ Zylos Raketer här</p>

<input id="discordName" placeholder="Discord namn">
<input id="mcName" placeholder="Minecraft namn">
<input id="amount" type="number" placeholder="Antal">
<input id="deadline" placeholder="Behövs senast">

<button onclick="submitOrder()">Skicka beställning</button>

<p class="note">
⚠️ OBS! Beställningen måste granskas av Zylo teamet.
Du får DM om vi kan fixa detta.
</p>

</section>

<!-- ADMIN -->
<section class="panel">

<h3>🔐 Admin verify</h3>

<input id="adminCode" placeholder="Admin kod">
<button onclick="verifyAdmin()">Verifiera</button>

<p id="adminStatus"></p>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
