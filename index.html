<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zylo - Minecraft Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg"></div>

<header>
  <h1>⛏ ZYLO HUB</h1>
  <p>Minecraft-inspirerad beställning & reviews</p>
</header>

<nav>
  <button onclick="toggleDropdown()">☰ Meny</button>
  <div id="dropdown" class="dropdown hidden">
    <button onclick="openSection('raketer')">Zylos Raketer</button>
    <button onclick="openSection('order')">Beställning</button>
    <button onclick="openSection('reviews')">Reviews</button>
  </div>
</nav>

<!-- RAKETER -->
<section id="raketer" class="card hidden">
  <h2>🚀 Zylos Raketer</h2>

  <div class="tooltip">
    <div class="item">🎆 Hover över mig</div>
    <span class="tooltiptext">
      Coords: -146 68 63<br>
      "Stället du köper dina raketer!"
    </span>
  </div>

  <h3>⭐ Reviews</h3>
  <div id="reviewList"></div>

  <div class="review-box">
    <select id="stars">
      <option value="5">★★★★★</option>
      <option value="4">★★★★☆</option>
      <option value="3">★★★☆☆</option>
      <option value="2">★★☆☆☆</option>
      <option value="1">★☆☆☆☆</option>
    </select>

    <input id="reviewText" placeholder="Skriv din review...">
    <button onclick="addReview()">Skicka</button>
  </div>
</section>

<!-- ORDER -->
<section id="order" class="card hidden">
  <h2>📦 Beställning</h2>

  <input id="item" placeholder="Vad vill du beställa?">
  <input id="amount" placeholder="Antal">
  <input id="discord" placeholder="Discord namn">
  <input id="mc" placeholder="Minecraft namn">
  <input id="deadline" placeholder="Deadline">

  <button onclick="sendOrder()">Skicka beställning</button>

  <p id="orderStatus"></p>
</section>

<!-- REVIEWS -->
<section id="reviews" class="card hidden">
  <h2>💬 Alla Reviews</h2>
  <div id="allReviews"></div>
</section>

<script src="script.js"></script>
</body>
</html>
