<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Zylo</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<h1>🚀 ZYLO</h1>

<p>
Minecraft Shop
</p>

</header>

<div class="mc-menu">

<button onclick="openTab('product')">
💥 Zylos Raketer
</button>

<button onclick="openTab('order')">
🛒 Beställning
</button>

</div>

<!-- PRODUKT -->

<section
id="product"
class="tab">

<h2>
💥 Zylos Raketer
</h2>

<div class="coords">

📍 Cords

-146 68 63

</div>

<h3>
Reviews
</h3>

<div id="stars">

<span onclick="rate(1)">⭐</span>
<span onclick="rate(2)">⭐</span>
<span onclick="rate(3)">⭐</span>
<span onclick="rate(4)">⭐</span>
<span onclick="rate(5)">⭐</span>

</div>

<textarea
id="reviewText"
placeholder="Skriv review">
</textarea>

<button onclick="leaveReview()">

Skicka review

</button>

<div id="reviewStats"></div>

<div id="reviewList"></div>

</section>

<!-- ORDER -->

<section
id="order"
class="tab">

<h2>

🛒 Beställning

</h2>

<p>

Vald:

<b id="selectedItem">

Firework Rocket

</b>

</p>

<select id="itemSelect">

<option>
Firework Rocket
</option>

<option>
Diamond
</option>

<option>
Netherite
</option>

<option>
Elytra Repair
</option>

</select>

<input
id="customItem"
placeholder="Skriv vad du vill beställa">

<input
id="discordName"
placeholder="Discord namn">

<input
id="mcName"
placeholder="Minecraft namn">

<input
id="amount"
type="number"
placeholder="Antal">

<input
id="deadline"
placeholder="När behövs det">

<button onclick="submitOrder()">

✔ Skicka

</button>

</section>

<script src="script.js"></script>

</body>

</html>
